<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸默想引导</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="app-title">🧘 呼吸默想引导</div>
            <div class="app-subtitle">随时随地的呼吸陪伴</div>
        </header>

        <!-- 设置界面 -->
        <div class="setup-screen" id="setupScreen">
            
            <div class="protocol-select">
                <div class="protocol-option active" data-protocol="sleep">
                    <div class="protocol-name">💤 睡眠呼吸 (4-7-8)</div>
                    <div class="protocol-desc">助眠放松，快速入睡</div>
                </div>
                <div class="protocol-option" data-protocol="neuro">
                    <div class="protocol-name">🧠 神经重塑协议</div>
                    <div class="protocol-desc">4步骤组合，深度调节</div>
                </div>
            </div>

            <div class="rounds-control" id="roundsControl">
                <label class="rounds-label">协议重复次数</label>
                <div class="rounds-selector">
                    <button class="rounds-btn" id="decreaseRounds">−</button>
                    <span class="rounds-value" id="roundsValue">3</span>
                    <button class="rounds-btn" id="increaseRounds">+</button>
                </div>
            </div>

            <div class="sound-settings">
                <div class="sound-title">🔊 声音设置</div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="tickSound" checked>
                        <span>节奏提示音</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="voiceGuide" checked>
                        <span>语音引导</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="musicToggle">
                        <span>背景音乐</span>
                    </label>
                </div>
                <div class="volume-control">
                    <span>提示音音量</span>
                    <input type="range" class="volume-slider" id="tickVolumeSlider" min="0" max="100" value="80">
                    <span id="tickVolumeValue">80%</span>
                </div>
                <div class="volume-control">
                    <span>完成音音量</span>
                    <input type="range" class="volume-slider" id="completionVolumeSlider" min="0" max="100" value="80">
                    <span id="completionVolumeValue">80%</span>
                </div>
                <div class="volume-control">
                    <span>语音音量</span>
                    <input type="range" class="volume-slider" id="voiceVolumeSlider" min="0" max="100" value="80">
                    <span id="voiceVolumeValue">80%</span>
                </div>
                <div class="volume-control">
                    <span>背景音乐音量</span>
                    <input type="range" class="volume-slider" id="musicVolumeSlider" min="0" max="100" value="40">
                    <span id="musicVolumeValue">40%</span>
                </div>
            </div>

            <button class="start-btn" id="startBtn">开始默想</button>
        </div>

        <!-- 练习界面 -->
        <div class="practice-screen hidden" id="practiceScreen">
            <div class="progress-info" id="progressInfo">神经重塑协议 - 第 1/3 轮</div>
            
            <div class="breath-circle-container">
                <div class="breath-circle" id="breathCircle">
                    <div class="phase-text" id="phaseText">准备</div>
                    <div class="countdown" id="countdown">3</div>
                </div>
            </div>

            <div class="step-info" id="stepInfo">
                <div class="step-name">激活呼吸 (4-7-8)</div>
                <div class="cycle-info">循环 <span id="cycleCount">1/5</span></div>
            </div>

            <div class="controls">
                <button class="control-btn" id="pauseBtn">暂停</button>
                <button class="control-btn" id="stopBtn">结束</button>
            </div>
        </div>

        <!-- 完成界面 -->
        <div class="setup-screen completion-screen hidden" id="completionScreen">
            <div class="completion-icon">✨</div>
            <div class="completion-text">默想完成！</div>
            <button class="start-btn" id="restartBtn">再次练习</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
